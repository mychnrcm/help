<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payer Portal Quick Lookup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 560px; width: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff; }
  .container { display: flex; flex-direction: column; height: 100%; width: 100%; }

  .header { background: #fff; border-bottom: 3px solid #C85A00; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .header-icon { width: 36px; height: 36px; background: #C85A00; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-icon svg { width: 18px; height: 18px; }
  .header-text h1 { font-size: 15px; font-weight: 700; color: #1a1a1a; }
  .header-text p { font-size: 11px; color: #6b7280; margin-top: 1px; }

  .search-section { padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; background: #faf9f8; border-bottom: 1px solid #e5e7eb; }
  .search-wrapper { flex: 1; position: relative; }
  .search-wrapper svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; pointer-events: none; }
  .search-input { width: 100%; padding: 7px 12px 7px 32px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; font-family: inherit; outline: none; background: #fff; transition: border-color 0.15s; }
  .search-input:focus { border-color: #C85A00; }
  .search-input::placeholder { color: #b0b7c0; }

  .filter-buttons { display: flex; gap: 5px; flex-shrink: 0; }
  .filter-btn { padding: 6px 13px; border: 1px solid #d1d5db; border-radius: 5px; background: #fff; font-size: 12px; font-family: inherit; cursor: pointer; transition: all 0.15s; color: #374151; font-weight: 500; white-space: nowrap; }
  .filter-btn:hover { border-color: #C85A00; color: #C85A00; }
  .filter-btn.active { background: #C85A00; border-color: #C85A00; color: #fff; }

  .list-container { flex: 1; overflow-y: auto; min-height: 0; }
  .list-container::-webkit-scrollbar { width: 5px; }
  .list-container::-webkit-scrollbar-track { background: #f3f4f6; }
  .list-container::-webkit-scrollbar-thumb { background: #C85A00; border-radius: 3px; }
  .list-container::-webkit-scrollbar-thumb:hover { background: #a34a00; }

  .section-header { display: flex; align-items: center; gap: 7px; padding: 8px 16px; font-size: 11px; font-weight: 600; color: #6b7280; background: #f9fafb; border-bottom: 1px solid #e5e7eb; border-top: 1px solid #e5e7eb; letter-spacing: 0.03em; text-transform: uppercase; position: sticky; top: 0; z-index: 2; }
  .section-header svg { width: 13px; height: 13px; flex-shrink: 0; }

  .payer-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; border-bottom: 1px solid #f3f4f6; gap: 10px; transition: background 0.1s; }
  .payer-row:hover { background: #fff8f4; }
  .payer-info { flex: 1; min-width: 0; }
  .payer-name { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; }
  .badges { display: flex; flex-wrap: wrap; gap: 3px; }

  .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; white-space: nowrap; letter-spacing: 0.01em; }
  .badge-green  { background: #dcfce7; color: #166534; }
  .badge-yellow { background: #fef9c3; color: #854d0e; }
  .badge-blue   { background: #dbeafe; color: #1e40af; }
  .badge-orange { background: #ffedd5; color: #9a3412; }
  .badge-purple { background: #f3e8ff; color: #6b21a8; }
  .badge-gray   { background: #f3f4f6; color: #4b5563; }
  .badge-teal   { background: #ccfbf1; color: #0f766e; }
  .badge-red    { background: #fee2e2; color: #991b1b; }

  .payer-action { flex-shrink: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 210px; }

  .portal-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; background: #C85A00; color: #fff; border: none; border-radius: 5px; font-size: 11px; font-weight: 600; font-family: inherit; cursor: pointer; text-decoration: none; transition: background 0.15s; white-space: nowrap; }
  .portal-btn:hover { background: #a34a00; }
  .portal-btn svg { width: 11px; height: 11px; flex-shrink: 0; stroke: white; }
  .portal-btn.secondary { background: #fff; color: #C85A00; border: 1px solid #C85A00; }
  .portal-btn.secondary:hover { background: #fff4ec; }
  .portal-btn.secondary svg { stroke: #C85A00; }

  .phone-display { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #C85A00; white-space: nowrap; }
  .phone-display svg { width: 13px; height: 13px; flex-shrink: 0; }
  .no-phone { font-size: 12px; color: #9ca3af; font-style: italic; }

  .empty-state { padding: 28px 20px; text-align: center; }
  .empty-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }
  .empty-title { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .empty-sub { font-size: 12px; color: #6b7280; line-height: 1.6; margin-bottom: 14px; }
  .empty-query { color: #C85A00; font-weight: 700; }
  .empty-search-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; background: #C85A00; color: #fff; border-radius: 5px; font-size: 12px; font-weight: 600; font-family: inherit; text-decoration: none; transition: background 0.15s; }
  .empty-search-btn:hover { background: #a34a00; }
  .empty-search-btn svg { width: 13px; height: 13px; stroke: white; }

  .footer { padding: 8px 16px; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: #fff; }
  .footer-count { font-size: 12px; color: #374151; }
  .footer-count strong { color: #C85A00; }
  .footer-updated { font-size: 11px; color: #9ca3af; }
</style>

const BADGE_MAP = {
  nologin:  { text: "No login needed",                   cls: "badge-green"  },
  account:  { text: "Account required",                  cls: "badge-yellow" },
  availity: { text: "Via Availity",                      cls: "badge-blue"   },
  callppc:  { text: "Must call PPC",                     cls: "badge-orange" },
  tmhpcob: { text: "Patient must contact MCO for COB update", cls: "badge-red" },
  elig:     { text: "Electronic eligibility transactions", cls: "badge-purple" },
};

const MONITOR_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`;
const PHONE_SVG   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 17z"/></svg>`;
const EXT_SVG     = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
const GLOBE_SVG   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
const NETWORK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="16" y="2" width="6" height="6" rx="1"/><rect x="9" y="16" width="6" height="6" rx="1"/><path d="M5 8v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><line x1="12" y1="14" x2="12" y2="16"/></svg>`;

const SMALL_PHONE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:10px;height:10px;flex-shrink:0"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 17z"/></svg>`;

let currentFilter = 'all';
let searchTerm = '';

function badgeHTML(list) {
  return list.map(b => {
    const m = BADGE_MAP[b];
    return m ? `<span class="badge ${m.cls}">${m.text}</span>` : '';
  }).join('');
}

function portalButtons(portals) {
  return portals.map(p =>
    `<a class="portal-btn${p.secondary ? ' secondary' : ''}" href="${p.url}" target="_blank" rel="noopener noreferrer">${EXT_SVG} ${p.label}</a>`
  ).join('');
}

function render() {
  const q = searchTerm.toLowerCase().trim();
  const portals  = PORTAL_PAYERS.filter(p => p.name.toLowerCase().includes(q));
  const phones   = PHONE_PAYERS.filter(p => p.name.toLowerCase().includes(q));
  const networks = NETWORK_PAYERS.filter(n => n.name.toLowerCase().includes(q));

  const showPortals  = currentFilter === 'all';
  const showPhones   = currentFilter === 'all' || currentFilter === 'phone';
  const showNetworks = currentFilter === 'all';

  let html = '';
  let count = 0;

  if (showPortals && portals.length) {
    count += portals.length;
    html += `<div class="section-header">${MONITOR_SVG} Portal payers (${portals.length})</div>`;
    portals.forEach(p => {
      const phoneBadge = p.phone
        ? `<span class="badge badge-teal" style="display:inline-flex;align-items:center;gap:3px;font-size:10px">${SMALL_PHONE} ${p.phone}</span>`
        : '';
      html += `<div class="payer-row">
        <div class="payer-info">
          <div class="payer-name">${p.name}</div>
          <div class="badges">${badgeHTML(p.badges)}${phoneBadge}</div>
        </div>
        <div class="payer-action">${portalButtons(p.portals)}</div>
      </div>`;
    });
  }

  if (showPhones && phones.length) {
    count += phones.length;
    html += `<div class="section-header">${PHONE_SVG} Phone only — refer to back of insurance card (${phones.length})</div>`;
    phones.forEach(p => {
  const eapBadge = p.eap ? `<span class="badge badge-red">Patient must provide authorization letter</span>` : '';
  const customBadge = p.tphbadge && BADGE_MAP[p.tphbadge] ? `<span class="badge ${BADGE_MAP[p.tphbadge].cls}">${BADGE_MAP[p.tphbadge].text}</span>` : '';
  html += `<div class="payer-row">
    <div class="payer-info">
      <div class="payer-name">${p.name}</div>
      <div class="badges"><span class="badge badge-gray">Refer to back of card</span>${eapBadge}${customBadge}</div>
        </div>
        <div class="payer-action">
          <div class="phone-display">${PHONE_SVG} ${p.phone}</div>
        </div>
      </div>`;
    });
  }

  if (showNetworks && networks.length) {
    count += networks.length;
    html += `<div class="section-header">${NETWORK_SVG} Typically network only (${networks.length})</div>`;
    networks.forEach(n => {
      html += `<div class="payer-row">
        <div class="payer-info">
          <div class="payer-name">${n.name}</div>
          <div class="badges">
            <span class="badge badge-orange">Typically network only</span>
            <span class="badge badge-gray">Confirm actual payer &amp; refer to back of card</span>
          </div>
        </div>
        <div class="payer-action"><div class="no-phone">No portal or phone</div></div>
      </div>`;
    });
  }

  if (!count) {
    const qDisplay = searchTerm ? `<span class="empty-query">"${searchTerm}"</span>` : 'that payer';
    const googleQ  = encodeURIComponent((searchTerm || 'insurance') + ' provider portal');
    html = `<div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">No payer found for ${qDisplay}</div>
      <div class="empty-sub">Refer to the back of the insurance card for contact info,<br>or try searching online for the provider portal.</div>
      <a class="empty-search-btn" href="https://www.google.com/search?q=${googleQ}" target="_blank" rel="noopener">${GLOBE_SVG} Search "${searchTerm || 'payer'} provider portal" online</a>
    </div>`;
  }

  document.getElementById('listContainer').innerHTML = html;
  document.getElementById('payerCount').textContent = count;
}

document.getElementById('searchInput').addEventListener('input', e => { searchTerm = e.target.value; render(); });

document.getElementById('filterAll').addEventListener('click', function() {
  currentFilter = 'all';
  this.classList.add('active');
  document.getElementById('filterPhone').classList.remove('active');
  render();
});
document.getElementById('filterPhone').addEventListener('click', function() {
  currentFilter = 'phone';
  this.classList.add('active');
  document.getElementById('filterAll').classList.remove('active');
  render();
});

render();
</script>
</body>
</html>
